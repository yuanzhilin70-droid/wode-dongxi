<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的东西</title>
<meta name="description" content="一个只给自己用的记录本">
<meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的东西">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>我的东西</h1>
      <span id="sync" class="sync" data-state="idle" title="同步状态"><i></i></span>
    </div>
    <button id="btn-menu" class="icon-btn" type="button" aria-label="更多">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <div class="searchbar">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="搜标题、内容、标签" autocomplete="off" spellcheck="false">
    <button id="q-clear" class="q-clear" type="button" aria-label="清空" hidden>×</button>
  </div>

  <nav id="chips" class="chips" aria-label="分类"></nav>

  <main id="list" class="list" aria-live="polite"></main>

  <button id="fab" class="fab" type="button" aria-label="新建记录">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- 编辑面板 -->
<div id="editor" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-head">
    <button type="button" class="text-btn" data-act="close">取消</button>
    <span class="sheet-title">写点什么</span>
    <button type="button" class="text-btn primary" data-act="save">保存</button>
  </div>
  <div class="sheet-body">
    <input id="f-title" class="f-title" type="text" placeholder="标题" maxlength="120">
    <textarea id="f-body" class="f-body" placeholder="正文…想到什么写什么" rows="6"></textarea>
    <div class="fields">
      <label class="field">
        <span>链接</span>
        <input id="f-url" type="url" inputmode="url" placeholder="https://…（可选）" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>分类</span>
        <input id="f-cat" type="text" list="cat-list" placeholder="生活 / 工作 / 想法…" maxlength="20" autocomplete="off">
      </label>
      <label class="field">
        <span>标签</span>
        <input id="f-tags" type="text" placeholder="用逗号分开，比如 书, 计划" maxlength="120" autocomplete="off">
      </label>
    </div>
    <datalist id="cat-list"></datalist>
    <label class="switch">
      <input id="f-pin" type="checkbox">
      <span>置顶这条</span>
    </label>
    <button id="f-del" class="danger-btn" type="button">删除这条记录</button>
    <p class="hint" id="f-hint"></p>
  </div>
</div>

<!-- 更多 -->
<div id="menu" class="sheet menu-sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-head">
    <span class="sheet-title">更多</span>
    <button type="button" class="text-btn" data-act="menu-close">完成</button>
  </div>
  <div class="sheet-body menu-body">
    <div class="menu-stat" id="menu-stat"></div>
    <button class="menu-item" type="button" data-act="export">
      <span>导出备份</span><small>下载一个 .json 文件</small>
    </button>
    <button class="menu-item" type="button" data-act="import">
      <span>导入备份</span><small>和现有记录合并，不会覆盖</small>
    </button>
    <button class="menu-item" type="button" data-act="import-bookmarks">
      <span>导入浏览器书签</span><small>选 Chrome 导出的 bookmarks.html</small>
    </button>
    <button class="menu-item" type="button" data-act="sync">
      <span>立即同步</span><small>手机和电脑之间对一下</small>
    </button>
    <button class="menu-item danger" type="button" data-act="wipe">
      <span>清空全部</span><small>删掉所有记录，慎重</small>
    </button>
    <p class="hint">数据存在电脑上的 notes-app/data/notes.json，随时可以复制走。</p>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <input id="bookmarks-file" type="file" accept=".html,text/html" hidden>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="./app.js"></script>
</body>
</html>
